name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilar la interfaz (→ clipero/app/static)
        run: cd web && npm ci && npm run build
      - name: Comprobar que la interfaz está dentro del paquete
        run: |
          test -f clipero/app/static/index.html || { echo "falta clipero/app/static/index.html: el wheel saldría sin interfaz"; exit 1; }
          test -f clipero/recursos/models/face_detection_yunet_2023mar.onnx || { echo "falta el modelo YuNet"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: El tag coincide con la versión de pyproject (salvo -rc)
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          case "$GITHUB_REF_NAME" in *-*) ;; *) test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME ≠ v$v"; exit 1; };; esac
      - name: Wheel y sdist
        run: python -m pip install build && python -m build
      - name: Comprobar el wheel
        run: python -m zipfile -l dist/*.whl | grep -q "clipero/app/static/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publicar en GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)

  pypi:
    # un tag con «-» (v0.1.0-rc1) es una prueba: no sube a PyPI, que no deja reutilizar una versión
    if: ${{ !contains(github.ref_name, '-') }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen y etiquetas (latest solo en un release, no en un -rc)
        run: |
          IMAGEN="ghcr.io/${GITHUB_REPOSITORY,,}"
          ETIQUETAS="$IMAGEN:$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in *-*) ;; *) ETIQUETAS="$ETIQUETAS,$IMAGEN:latest";; esac
          echo "ETIQUETAS=$ETIQUETAS" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.ETIQUETAS }}
