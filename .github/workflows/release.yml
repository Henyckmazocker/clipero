name: Release

on:
  push:
    tags: ["v*"]

jobs:
  imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: El tag coincide con la versión de pyproject (salvo -rc)
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          case "$GITHUB_REF_NAME" in *-*) ;; *) test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME ≠ v$v"; exit 1; };; esac
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen y etiquetas (latest solo en un release, no en un -rc)
        run: |
          IMAGEN="ghcr.io/${GITHUB_REPOSITORY,,}"
          ETIQUETAS="$IMAGEN:$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in *-*) ;; *) ETIQUETAS="$ETIQUETAS,$IMAGEN:latest";; esac
          echo "ETIQUETAS=$ETIQUETAS" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.ETIQUETAS }}
      - name: GitHub Release con notas (sin ficheros)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
